<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hinglish AI ~ Cosmic Edition</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Marked.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>

    <style>
        :root {
            --orb-size: 180px;
            --orb-color: 139, 92, 246;
            /* Purple-500 */
        }

        body {
            background: #0f0c29;
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            /* App-like feel */
        }

        /* --- ORB STYLES --- */
        .orb-container {
            position: relative;
            width: var(--orb-size);
            height: var(--orb-size);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .orb-core {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(var(--orb-color), 0.8), rgba(var(--orb-color), 0.4));
            box-shadow: 0 0 40px rgba(var(--orb-color), 0.6), inset 0 0 20px rgba(255, 255, 255, 0.5);
            z-index: 10;
            transition: transform 0.1s ease-out;
            /* For audio reactivity */
        }

        /* Glow Rings */
        .orb-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 2px solid rgba(var(--orb-color), 0.3);
            box-shadow: 0 0 20px rgba(var(--orb-color), 0.2);
            opacity: 0;
            pointer-events: none;
        }

        /* Animations */
        @keyframes breathe {

            0%,
            100% {
                transform: scale(0.95);
                opacity: 0.6;
            }

            50% {
                transform: scale(1.05);
                opacity: 0.8;
            }
        }

        @keyframes pulse-ring {
            0% {
                width: 100%;
                height: 100%;
                opacity: 0.8;
                border-color: rgba(var(--orb-color), 0.8);
            }

            100% {
                width: 250%;
                height: 250%;
                opacity: 0;
                border-color: rgba(var(--orb-color), 0.1);
            }
        }

        @keyframes spin-slow {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            100% {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        /* STATE CLASSES */
        .state-idle .orb-core {
            animation: breathe 4s ease-in-out infinite;
        }

        .state-listening .orb-ring {
            animation: pulse-ring 2s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
        }

        .state-listening .orb-core {
            box-shadow: 0 0 60px rgba(239, 68, 68, 0.6);
            /* Red glow for recording */
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(239, 68, 68, 0.8), rgba(153, 27, 27, 0.4));
        }

        .state-processing .orb-core {
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(59, 130, 246, 0.8), rgba(30, 58, 138, 0.4));
            /* Blue */
            animation: breathe 0.5s ease-in-out infinite;
        }

        .state-speaking .orb-core {
            /* Will be animated by JS Web Audio */
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(16, 185, 129, 0.8), rgba(6, 78, 59, 0.4));
            /* Green/Teal */
            box-shadow: 0 0 80px rgba(16, 185, 129, 0.5);
        }

        /* --- UI COMPONENTS --- */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }

        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .chat-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .msg-bubble {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease-out;
        }

        .msg-user {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border-top-right-radius: 4px;
            margin-left: auto;
        }

        .msg-ai {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            border-top-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .action-btn {
            transition: all 0.2s;
        }

        .action-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body class="h-screen flex flex-col items-center">

    <!-- HEADER -->
    <header class="w-full flex justify-between items-center p-6 z-20">
        <div class="glass-panel px-4 py-2 flex items-center gap-3">
            <div class="w-3 h-3 bg-green-400 rounded-full animate-pulse shadow-[0_0_10px_#4ade80]"></div>
            <span class="text-white/90 font-semibold tracking-wide text-sm">HINGLISH AI</span>
        </div>
        <button onclick="clearChat()" class="text-white/40 hover:text-white transition-colors text-sm">Clear</button>
    </header>

    <!-- MAIN VISUALIZER AREA -->
    <div class="flex-1 w-full flex flex-col items-center justify-center relative -mt-20 pb-[45vh]">

        <!-- Live Transcript Overlay -->
        <div id="live-transcript"
            class="absolute top-24 w-full max-w-lg text-center px-4 transition-opacity duration-300 opacity-0 transform translate-y-4">
            <p class="text-white/60 text-lg font-light italic bg-black/20 backdrop-blur-sm p-4 rounded-xl border border-white/5"
                id="transcript-text">...</p>
        </div>

        <!-- THE ORB -->
        <div id="orb"
            class="orb-container state-idle cursor-pointer transition-all duration-500 scale-110 hover:scale-125 active:scale-95">
            <div class="orb-core"></div>
            <!-- Rings for animations -->
            <div class="orb-ring" style="animation-delay: 0s;"></div>
            <div class="orb-ring" style="animation-delay: 0.5s;"></div>
            <div class="orb-ring" style="animation-delay: 1s;"></div>
        </div>

        <!-- Status Text -->
        <div class="mt-16 text-center z-10 pointer-events-none">
            <h2 id="status-label"
                class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-200 to-blue-200 tracking-wider">
                Namaste</h2>
            <p class="text-white/30 text-xs mt-2 font-mono uppercase tracking-widest">Hold the Orb to speak</p>
        </div>

    </div>

    <!-- BOTTOM SHEET / CHAT AREA -->
    <div class="fixed bottom-0 left-0 right-0 h-[45vh] bg-[#0f0c29]/90 backdrop-blur-2xl border-t border-white/10 rounded-t-[40px] flex flex-col shadow-[0_-10px_40px_rgba(0,0,0,0.5)] z-20 transition-all duration-500"
        id="chat-panel">

        <!-- Drag Handle -->
        <div class="w-full flex justify-center py-4 cursor-pointer hover:bg-white/5 transition-colors rounded-t-[40px]"
            onclick="toggleChatHeight()">
            <div class="w-12 h-1.5 bg-white/20 rounded-full"></div>
        </div>

        <!-- Chat History -->
        <div id="chat-history" class="flex-1 overflow-y-auto chat-scroll px-6 pb-2 space-y-4">
            <!-- Messages injected here -->
            <div class="flex items-center justify-center h-full text-white/20 text-sm">
                Conversation History will appear here
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-6 relative bg-gradient-to-t from-[#0f0c29] to-transparent">
            <div class="glass-panel p-2 flex items-center gap-2 shadow-2xl border-white/10 bg-[#1a1638]">
                <input type="text" id="text-input" placeholder="Type a message..."
                    class="flex-1 bg-transparent border-none outline-none text-white px-4 py-3 placeholder-white/20 font-medium">

                <button onclick="sendText()" id="send-btn"
                    class="p-3 bg-white/10 rounded-full hover:bg-white/20 text-white transition hover:shadow-[0_0_15px_rgba(255,255,255,0.1)]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m5 12 7-7 7 7" />
                        <path d="M12 19V5" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Use standard SVGs to ensure icons always load
        const PLAY_ICON = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3 h-3"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;
        const LOADING_ICON = `<svg class="animate-spin -ml-1 mr-3 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;

        // --- DOM ELEMENTS ---
        const orb = document.getElementById('orb');
        const statusLabel = document.getElementById('status-label');
        const transcriptText = document.getElementById('transcript-text');
        const liveTranscriptContainer = document.getElementById('live-transcript');
        const chatHistory = document.getElementById('chat-history');
        const textInput = document.getElementById('text-input');
        const sendBtn = document.getElementById('send-btn');
        const orbCore = document.querySelector('.orb-core');

        // --- STATE MANAGEMENT ---
        let state = 'idle'; // idle, listening, processing, speaking
        let mediaRecorder;
        let audioChunks = [];
        let audioContext;
        let analyser;

        function setState(newState) {
            state = newState;
            orb.className = `orb-container state-${newState} cursor-pointer transition-all duration-500 scale-110`;

            switch (newState) {
                case 'idle':
                    statusLabel.innerText = "Namaste";
                    statusLabel.className = "text-2xl font-bold text-white/80";
                    break;
                case 'listening':
                    statusLabel.innerText = "I'm Listening...";
                    statusLabel.className = "text-2xl font-bold text-red-300 animate-pulse";
                    break;
                case 'processing':
                    statusLabel.innerText = "Thinking...";
                    statusLabel.className = "text-2xl font-bold text-blue-300 animate-bounce";
                    break;
                case 'speaking':
                    statusLabel.innerText = "Speaking...";
                    statusLabel.className = "text-2xl font-bold text-green-300";
                    break;
            }
        }

        setState('idle');

        // --- AUDIO VISUALIZER (Web Audio API) ---
        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function visualizeAudio(streamOrSource) {
            initAudioContext();

            // Cleanup previous analyser if exists to prevent feedback loops
            if (analyser) {
                try { analyser.disconnect(); } catch (e) { }
            }

            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;

            let source;
            if (streamOrSource instanceof MediaStream) {
                source = audioContext.createMediaStreamSource(streamOrSource);
            } else {
                // It's an AudioNode (for playback)
                source = streamOrSource;
            }

            source.connect(analyser);
            if (!(streamOrSource instanceof MediaStream)) {
                analyser.connect(audioContext.destination); // Connect playback to speakers
            }

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            // STOP loop if we change state away from speaking/listening
            const currentAnimationState = state;

            function animate() {
                if (state !== 'speaking' && state !== 'listening') {
                    orbCore.style.transform = `scale(1)`;
                    return;
                }

                requestAnimationFrame(animate);
                analyser.getByteFrequencyData(dataArray);

                // Calculate average volume
                let sum = 0;
                for (let i = 0; i < bufferLength; i++) {
                    sum += dataArray[i];
                }
                const average = sum / bufferLength;

                // Map to scale (1.0 to 1.6 for more dramatic effect)
                const scale = 1 + (average / 100);
                orbCore.style.transform = `scale(${scale})`;

                // Also modulate glow opacity
                orbCore.style.opacity = 0.5 + (average / 255);
            }

            animate();
        }

        // --- CHAT LOGIC ---
        function appendMessage(text, isUser, audioBase64 = null) {
            // Remove "Conversation History" placeholder if exists
            if (chatHistory.innerText.includes("Conversation History")) {
                chatHistory.innerHTML = '';
            }

            const div = document.createElement('div');
            div.className = `flex w-full mb-4 animate-fade-in`;
            div.style.justifyContent = isUser ? 'flex-end' : 'flex-start';

            const bubble = document.createElement('div');
            bubble.className = `msg-bubble ${isUser ? 'msg-user' : 'msg-ai'}`;

            // Markdown parsing for AI
            if (!isUser) {
                bubble.innerHTML = marked.parse(text);
            } else {
                bubble.innerText = text;
            }

            // Audio Button for AI
            if (!isUser) {
                const controls = document.createElement('div');
                controls.className = "flex items-center gap-2 mt-3 pt-2 border-t border-white/10";

                const playBtn = document.createElement('button');
                playBtn.className = "text-xs flex items-center gap-1.5 text-white/70 hover:text-white transition-all bg-white/5 hover:bg-white/10 px-3 py-1.5 rounded-full";
                playBtn.innerHTML = `${PLAY_ICON} <span>Listen</span>`;

                playBtn.onclick = async () => {
                    playBtn.innerHTML = `${LOADING_ICON} Loading`;
                    await playAudioContent(audioBase64 || text, !audioBase64);
                    playBtn.innerHTML = `${PLAY_ICON} Listen Again`;
                };

                controls.appendChild(playBtn);
                bubble.appendChild(controls);
            }

            div.appendChild(bubble);
            chatHistory.appendChild(div);

            // Auto Scroll
            setTimeout(() => {
                chatHistory.scrollTo({ top: chatHistory.scrollHeight, behavior: 'smooth' });
            }, 50);
        }

        // --- NETWORK & API ---
        async function playAudioContent(content, isText = false) {
            initAudioContext();
            if (audioContext.state === 'suspended') await audioContext.resume();

            let audioData;

            if (isText) {
                // Fetch TTS
                setState('processing');
                try {
                    const res = await fetch('/tts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: content })
                    });
                    const data = await res.json();
                    if (data.error) throw new Error(data.error);
                    audioData = "data:audio/mp3;base64," + data.audio;
                } catch (e) {
                    console.error("TTS Fetch Failed", e);
                    setState('idle');
                    statusLabel.innerText = "Audio Error";
                    return;
                }
            } else {
                // It's base64
                audioData = "data:audio/mp3;base64," + content;
            }

            // Play
            const audio = new Audio(audioData);
            const source = audioContext.createMediaElementSource(audio);

            setState('speaking');
            visualizeAudio(source); // Connects to speaker and analyser

            audio.play().catch(e => console.error("Play failed", e));

            audio.onended = () => {
                setState('idle');
            };
        }

        async function sendText() {
            const text = textInput.value.trim();
            if (!text) return;

            appendMessage(text, true);
            textInput.value = '';
            setState('processing');

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ text: text })
                });
                const data = await res.json();

                appendMessage(data.response, false);
                setState('idle');
            } catch (e) {
                console.error(e);
                appendMessage("Connection Error", false);
                setState('idle');
            }
        }

        // --- VOICE RECORDING LOGIC ---
        async function setupMic() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

                mediaRecorder.onstart = () => {
                    audioChunks = [];
                    visualizeAudio(stream); // Visualize User Voice
                };

                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });

                    // UI Updates
                    setState('processing');
                    liveTranscriptContainer.style.opacity = '0';

                    const formData = new FormData();
                    formData.append('file', blob, 'voice.webm');

                    try {
                        const res = await fetch('/talk', { method: 'POST', body: formData });
                        const data = await res.json();

                        if (data.error) throw new Error(data.error);

                        // Show Transcript
                        appendMessage(data.user_text, true);

                        // Show AI Response + Play Audio
                        appendMessage(data.ai_text, false, data.audio);

                        // Auto Play
                        playAudioContent(data.audio, false);

                    } catch (e) {
                        console.error(e);
                        setState('idle');
                        statusLabel.innerText = "Error";
                        setTimeout(() => setState('idle'), 2000);
                    }
                };

            } catch (e) {
                console.error("Mic Error", e);
                statusLabel.innerText = "Mic Denied";
            }
        }
        setupMic();

        // --- EVENTS ---

        // Touch/Mouse handling for Voice
        function startRecord(e) {
            e.preventDefault();
            if (mediaRecorder && mediaRecorder.state === 'inactive') {
                setState('listening');
                liveTranscriptContainer.style.opacity = '1';
                transcriptText.innerText = "I'm listening...";
                mediaRecorder.start();
            }
        }

        function stopRecord(e) {
            e.preventDefault();
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }
        }

        // --- BINDING TO ORB ---
        orb.addEventListener('mousedown', startRecord);
        orb.addEventListener('mouseup', stopRecord);
        orb.addEventListener('mouseleave', () => { if (state === 'listening') stopRecord(new Event('e')) });

        orb.addEventListener('touchstart', (e) => { e.preventDefault(); startRecord(e); });
        orb.addEventListener('touchend', (e) => { e.preventDefault(); stopRecord(e); });

        // Text Input Events
        textInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendText();
        });

        // Toggle Chat Panel Height for mobile
        let isExpanded = false;
        function toggleChatHeight() {
            const panel = document.getElementById('chat-panel');
            isExpanded = !isExpanded;
            panel.style.height = isExpanded ? '85vh' : '45vh';
        }

    </script>
</body>

</html>
